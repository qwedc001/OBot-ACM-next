<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="OBot-EP">
  <!--
    和站内 logo（web/src/components/OBotLogo.vue）同一个机器人头：
    外面加了一块品牌渐变底板，favicon 在浅色/深色浏览器栏上都要看得见。
    眼睛靠 evenodd 镂空、嘴用黑色填进 mask，镂空处透出底板渐变。
  -->
  <defs>
    <linearGradient id="plate" x1="6" y1="4" x2="90" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5d90b2" />
      <stop offset="1" stop-color="#4e7f70" />
    </linearGradient>
    <mask id="bot" maskUnits="userSpaceOnUse" x="0" y="0" width="96" height="96">
      <g transform="translate(3.6 7.8) scale(1.85)" fill="#fff">
        <circle cx="24" cy="5.4" r="2.9" />
        <rect x="22.7" y="8.2" width="2.6" height="4.4" rx="1.3" />
        <path
          fill-rule="evenodd"
          clip-rule="evenodd"
          d="M13 13h22a6 6 0 0 1 6 6v14a6 6 0 0 1-6 6H13a6 6 0 0 1-6-6V19a6 6 0 0 1 6-6Zm4.6 8.4a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm12.8 0a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"
        />
        <rect x="18.6" y="33.2" width="10.8" height="2.7" rx="1.35" fill="#000" />
      </g>
    </mask>
  </defs>
  <rect width="96" height="96" rx="21" fill="url(#plate)" />
  <rect width="96" height="96" rx="21" fill="#fff" mask="url(#bot)" />
</svg>
